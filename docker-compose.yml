services:

  mongodb:
    image: mongo:7
    container_name: filmfolio-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filmfolio-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      CONNECTIONSTRING: mongodb://mongodb:27017/filmfolio
      PORT: 5000
      JWT_SECRET: filmfolio-local-secret
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND: http://localhost:5000
    container_name: filmfolio-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
